version: "3.9"

services:
  # ─── Phase 1: Core Infrastructure | 核心基础设施 ───

  postgres:  # PostgreSQL 16 + pgvector | 向量数据库
    image: pgvector/pgvector:pg16
    container_name: daos-pg
    environment:
      POSTGRES_DB: daos
      POSTGRES_USER: daos
      POSTGRES_PASSWORD: ${PG_PASSWORD:-daos_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - daos-net
    restart: unless-stopped

  redis:  # In-memory cache + queue | 内存缓存与队列
    image: redis:7-alpine
    container_name: daos-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - daos-net
    restart: unless-stopped

  nats:  # Message bus | 消息总线 (JetStream enabled | 启用持久化)
    image: nats:2.10-alpine
    container_name: daos-nats
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--port=4222"
      - "--http_port=8222"
    volumes:
      - natsdata:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - daos-net
    restart: unless-stopped

  opa:  # Open Policy Agent | 策略引擎
    image: openpolicyagent/opa:1.0.0-static
    container_name: daos-opa
    command:
      - "run"
      - "--server"
      - "--addr=:8181"
      - "/policies"
      - "--set=decision_logs.console=true"
    volumes:
      - ../policies:/policies:ro
      - ../baseline:/baseline:ro
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "opa", "version"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - daos-net
    restart: unless-stopped

  # ─── Phase 2: DAOS Core Services | DAOS 核心服务 ───

  drift-detector:  # Observation: detect drift from baseline | 观测：检测基线漂移
    image: python:3.12-slim
    container_name: daos-drift-detector
    volumes:
      - ../services/drift-detector:/app:ro
      - ../baseline:/baseline:ro
    environment:
      NATS_URL: nats://nats:4222
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - daos-net
    restart: unless-stopped

  intent-compiler:  # Control: compile intents | 控制：编译 Intent
    image: python:3.12-slim
    container_name: daos-intent-compiler
    volumes:
      - ../services/intent-compiler:/app:ro
      - ../schemas:/schemas:ro
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - daos-net
    restart: unless-stopped

  policy-gateway:  # Safety: gate intents through OPA | 安全：OPA 门禁
    image: python:3.12-slim
    container_name: daos-policy-gateway
    environment:
      OPA_URL: http://opa:8181
      NATS_URL: nats://nats:4222
    depends_on:
      opa:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - daos-net
    restart: unless-stopped

  simulator:  # Simulation: digital twin pre-flight | 模拟：数字孪生预飞
    image: python:3.12-slim
    container_name: daos-simulator
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - daos-net
    restart: unless-stopped

  executor:  # Execution: sandbox runner | 执行：沙箱执行器
    image: python:3.12-slim
    container_name: daos-executor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../rollback:/rollback:ro
    environment:
      NATS_URL: nats://nats:4222
      FIRECRACKER_SOCKET: /tmp/firecracker.sock
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - daos-net
    restart: unless-stopped

  verifier:  # Verification: post-execution checks | 验证：执行后多维度检查
    image: python:3.12-slim
    container_name: daos-verifier
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - daos-net
    restart: unless-stopped

  audit-recorder:  # Audit: immutable chain of events | 审计：不可变事件链
    image: python:3.12-slim
    container_name: daos-audit-recorder
    volumes:
      - auditdata:/data
    environment:
      NATS_URL: nats://nats:4222
      PG_URL: postgres://daos:${PG_PASSWORD:-daos_secret}@postgres:5432/daos
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - daos-net
    restart: unless-stopped

  # ─── Phase 2: Observability | 可观测性 ───

  prometheus:  # Metrics collection | 指标采集
    image: prom/prometheus:latest
    container_name: daos-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9092:9090"
    networks:
      - daos-net
    restart: unless-stopped

  grafana:  # Dashboard | 仪表盘
    image: grafana/grafana:latest
    container_name: daos-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-daos_admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - daos-net
    restart: unless-stopped

volumes:
  pgdata:     # PostgreSQL data | 数据库持久化
  redisdata:  # Redis data | 缓存持久化
  natsdata:   # NATS JetStream data | 消息流持久化
  promdata:   # Prometheus data | 指标持久化
  grafanadata:
  auditdata:  # Audit records | 审计记录持久化

networks:
  daos-net:
    driver: bridge  # Isolated Docker network | 隔离的 Docker 网络
